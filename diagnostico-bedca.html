<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Diagnóstico BEDCA</title>
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; background: #fafafa; }
  .card h3 { margin: 0 0 8px 0; font-size: 14px; }
  .card pre.payload { background: #eee; padding: 8px; border-radius: 6px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  button { background: #1f4d38; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: 0.5; }
  .result { margin-top: 10px; font-size: 12px; }
  .result pre { background: #fff; border: 1px solid #ccc; padding: 8px; border-radius: 6px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
  .status { font-weight: bold; }
  .status.ok { color: #1f4d38; }
  .status.fail { color: #a33; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 8px; }
  label { font-size: 12px; color: #555; }
</style>
</head>
<body>

<h1>🔍 Diagnóstico de conexión con BEDCA</h1>
<p>Cambia esta URL por la de tu Worker si es distinta, y pulsa cada botón para probar un formato de petición distinto. Mira qué responde cada uno.</p>

<label>URL de tu Worker (proxy)</label>
<input type="text" id="proxyUrl" value="https://bedca-proxy.pablo-dblanco.workers.dev/" />

<div id="tests"></div>

<script>
const proxyUrlInput = document.getElementById("proxyUrl");
const testsContainer = document.getElementById("tests");

// Distintos formatos "candidatos" de petición, basados en cómo funcionan otras
// integraciones conocidas de BEDCA. Probamos varios a la vez para ver cuál responde con datos reales.
const candidates = [
  {
    name: "Candidato 1: búsqueda simple por nombre (XML plano)",
    body: `<?xml version="1.0" encoding="UTF-8"?><foodquery><food><name>pollo</name></food></foodquery>`,
  },
  {
    name: "Candidato 2: formulario tipo 'query' con acción de búsqueda",
    body: `query=search&food_name=pollo&lang=es`,
    contentType: "application/x-www-form-urlencoded",
  },
  {
    name: "Candidato 3: XML con etiqueta 'busqueda_alim'",
    body: `<?xml version="1.0"?><busqueda_alim><nombre_alim>pollo</nombre_alim></busqueda_alim>`,
  },
  {
    name: "Candidato 4: petición de grupos de alimentos (sin búsqueda, solo para ver si el servidor responde algo válido)",
    body: `<?xml version="1.0"?><foodgroups></foodgroups>`,
  },
  {
    name: "Candidato 5: parámetros sueltos (estilo GET simulando POST)",
    body: `f_alimento=pollo`,
    contentType: "application/x-www-form-urlencoded",
  },
];

function renderTests() {
  testsContainer.innerHTML = "";
  candidates.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h3>${c.name}</h3>
      <pre class="payload">${c.body}</pre>
      <button data-idx="${i}">Probar este</button>
      <div class="result" id="result-${i}"></div>
    `;
    testsContainer.appendChild(div);
  });

  testsContainer.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => runTest(Number(btn.dataset.idx), btn));
  });
}

async function runTest(idx, btn) {
  const c = candidates[idx];
  const resultDiv = document.getElementById(`result-${idx}`);
  btn.disabled = true;
  resultDiv.innerHTML = `<span>Probando…</span>`;

  const proxyUrl = proxyUrlInput.value.trim();

  try {
    const res = await fetch(proxyUrl, {
      method: "POST",
      headers: { "Content-Type": c.contentType || "text/xml" },
      body: c.body,
    });
    const text = await res.text();
    const looksLikeError = /error|<html|not found|404/i.test(text) && text.length < 4000;
    const statusClass = res.ok && !looksLikeError ? "ok" : "fail";
    resultDiv.innerHTML = `
      <div class="status ${statusClass}">HTTP ${res.status} ${res.ok ? "OK" : "ERROR"}</div>
      <pre>${text.slice(0, 1500).replace(/</g, "&lt;")}</pre>
    `;
  } catch (err) {
    resultDiv.innerHTML = `<div class="status fail">Fallo de red: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

renderTests();
</script>

</body>
</html>
