<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rueda de Platos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>" />

<!-- PWA: permite "Añadir a pantalla de inicio" en móvil y "Instalar" en ordenador -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f4d38" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rueda de Platos" />

<style>
  html, body { margin: 0; padding: 0; background: #f1ede0; min-height: 100vh; }
  #root { min-height: 100vh; }
</style>

<!-- Mapa de importaciones: permite usar "import React from 'react'" tal cual en el navegador,
     sin necesidad de instalar nada ni montar un proceso de build. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1"
  }
}
</script>

<!-- Babel Standalone: transforma el JSX de app.jsx a JavaScript normal, en el propio navegador. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Polyfill de almacenamiento: la app original usa window.storage (memoria de Claude).
     Aquí lo sustituimos por localStorage del navegador, con la misma forma (get/set/delete/list),
     para que el resto del código funcione exactamente igual sin tocarlo. -->
<script>
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  // Registro del service worker para que funcione offline y sea instalable como app.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

<script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>
</body>
</html>
