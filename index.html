<!-- Babel Standalone: transforma el JSX de app.jsx a JavaScript normal, en el propio navegador. -->

<!-- El guardado de datos y el login se gestionan en auth-bootstrap.jsx (Firebase),
     que se encarga de mostrar el login y, una vez dentro, cargar la app real (app.jsx). -->
<script>
  // Registro del service worker para que funcione offline y sea instalable como app. Se guarda la
  // promesa en window.swRegistrationPromise para que auth-bootstrap.jsx pueda esperar a que exista
  // el registro antes de pedir un token de notificaciones push (getToken lo necesita para saber a
  // qué service worker asociar los mensajes en segundo plano — ver el manejador en sw.js).
  window.swRegistrationPromise = new Promise((resolve) => {
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(resolve).catch(() => resolve(null));
      });
    } else {
      resolve(null);
    }
  });
</script>

<script type="text/babel" data-type="module" data-presets="react" src="auth-bootstrap.jsx"></script>
