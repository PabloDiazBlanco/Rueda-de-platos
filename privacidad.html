<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Política de privacidad · FoodDraft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>" />
<script type="importmap">
{
  "imports": {
    "i18n": "./Logica/i18n.js"
  }
}
</script>
<style>
  :root {
    --paper: #f1ede0; --card: #fffdf7; --ink: #2b2b26; --ink-soft: #6b6a5e; --line: #ddd6bf;
    --green: #2f6b4f; --green-dark: #1f4d38; --green-soft: #e6efe6;
    --mustard: #d9a441; --mustard-dark: #a9721f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; position: relative; }
  header { text-align: center; margin-bottom: 32px; }
  header .emoji { font-size: 34px; margin-bottom: 6px; }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif; font-size: 22px; color: var(--green-dark);
    margin: 0 0 4px;
  }
  header .updated { font-size: 12.5px; color: var(--ink-soft); }
  .idioma-switch { position: absolute; top: 20px; right: 20px; display: flex; gap: 4px; }
  .idioma-switch button {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); cursor: pointer;
  }
  .idioma-switch button.activo { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 24px 8px; margin-bottom: 20px;
  }
  .card p { font-size: 13.5px; margin: 0 0 16px; }
  h2 {
    font-family: Georgia, 'Times New Roman', serif; font-size: 17px; color: var(--green-dark);
    margin: 0 0 10px;
  }
  ul { margin: 0 0 16px; padding-left: 20px; font-size: 13.5px; }
  li { margin-bottom: 6px; }
  strong { color: var(--ink); }
  a { color: var(--green-dark); }
  .back {
    display: inline-block; margin-top: 8px; font-size: 13px; color: var(--green-dark);
    text-decoration: underline;
  }
  footer { text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="idioma-switch" id="idioma-switch"></div>

  <header>
    <div class="emoji">🍽️</div>
    <h1 data-i18n="privacidad.titulo">Política de privacidad — FoodDraft</h1>
    <div class="updated" data-i18n="privacidad.actualizado">Última actualización: 9 de septiembre de 2026</div>
  </header>

  <div class="card">
    <h2 data-i18n="privacidad.responsableHeader">Responsable del tratamiento</h2>
    <p data-i18n-html="privacidad.responsableTexto"></p>

    <h2 data-i18n="privacidad.datosHeader">Qué datos se recogen</h2>
    <ul>
      <li data-i18n-html="privacidad.datosCuenta"></li>
      <li data-i18n-html="privacidad.datosPerfil"></li>
      <li data-i18n-html="privacidad.datosSeguimiento"></li>
      <li data-i18n-html="privacidad.datosFotos"></li>
    </ul>

    <h2 data-i18n="privacidad.paraQueHeader">Para qué se usan</h2>
    <p data-i18n="privacidad.paraQueTexto"></p>

    <h2 data-i18n="privacidad.baseLegalHeader">Base legal</h2>
    <p data-i18n="privacidad.baseLegalTexto"></p>

    <h2 data-i18n="privacidad.conQuienHeader">Con quién se comparten</h2>
    <ul>
      <li data-i18n-html="privacidad.conQuienFirebase"></li>
      <li data-i18n-html="privacidad.conQuienStripe"></li>
      <li data-i18n="privacidad.conQuienNadie"></li>
    </ul>

    <h2 data-i18n="privacidad.cuantoTiempoHeader">Cuánto tiempo se conservan</h2>
    <p data-i18n="privacidad.cuantoTiempoTexto"></p>

    <h2 data-i18n="privacidad.derechosHeader">Tus derechos</h2>
    <p data-i18n-html="privacidad.derechosTexto"></p>

    <h2 data-i18n="privacidad.seguridadHeader">Seguridad</h2>
    <p data-i18n="privacidad.seguridadTexto"></p>

    <h2 data-i18n="privacidad.cambiosHeader">Cambios en esta política</h2>
    <p data-i18n="privacidad.cambiosTexto"></p>
  </div>

  <footer>
    <a class="back" href="./index.html" data-i18n="privacidad.volver">&larr; Volver a FoodDraft</a>
  </footer>

</div>

<script type="module">
  import { t, IDIOMAS_DISPONIBLES, leerIdiomaGuardado, guardarIdiomaLocal } from "i18n";

  function aplicarIdioma(idioma) {
    document.documentElement.lang = idioma;
    document.title = t(idioma, "privacidad.titulo") + " · FoodDraft";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(idioma, el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => {
      el.innerHTML = t(idioma, el.getAttribute("data-i18n-html"));
    });
    document.querySelectorAll(".idioma-switch button").forEach((btn) => {
      btn.classList.toggle("activo", btn.dataset.idioma === idioma);
    });
  }

  const switchEl = document.getElementById("idioma-switch");
  IDIOMAS_DISPONIBLES.forEach((i) => {
    const btn = document.createElement("button");
    btn.textContent = i.key.toUpperCase();
    btn.dataset.idioma = i.key;
    btn.onclick = () => {
      guardarIdiomaLocal(i.key);
      aplicarIdioma(i.key);
    };
    switchEl.appendChild(btn);
  });

  aplicarIdioma(leerIdiomaGuardado());
</script>

</body>
</html>
